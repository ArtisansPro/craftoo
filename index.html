<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftoo - Application</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; padding: 10px; min-height: 100vh; }
    
    .app { background: #ffffff; width: 100%; max-width: 420px; border-radius: 20px; padding: 15px; min-height: 600px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    /* Navigation Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; margin-bottom: 15px; }
    .btn-back { background: #0052cc; color: white; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .page-title { font-size: 16px; font-weight: bold; color: #1e293b; }

    /* Lang Selectors */
    .lang-bar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
    .lang-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 2px 6px; border-radius: 6px; font-size: 11px; cursor: pointer; white-space: nowrap; }

    /* Profile Header */
    .profile-header { text-align: center; margin-bottom: 10px; }
    .profile-avatar { width: 85px; height: 85px; border-radius: 18px; object-fit: cover; margin: 0 auto 6px; display: block; border: 2px solid #e2e8f0; }
    .profile-name { font-size: 18px; font-weight: bold; color: #0f172a; }
    .profile-badge { display: inline-block; background: #e0f2fe; color: #0284c7; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-top: 2px; }
    .rating-row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
    .rating-score { font-size: 16px; font-weight: bold; color: #d97706; }
    .stars { color: #f59e0b; font-size: 13px; }

    /* Container: Split Details & Gallery Side-by-Side */
    .info-gallery-wrapper { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; }
    
    /* Left Details Column */
    .details-column { flex: 1.1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .info-card { background: #f8fafc; border-radius: 10px; padding: 6px 8px; display: flex; align-items: center; gap: 8px; border: 1px solid #f1f5f9; }
    .info-icon { width: 28px; height: 28px; background: #e0f2fe; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .info-content { overflow: hidden; }
    .info-label { font-size: 9px; color: #64748b; }
    .info-value { font-size: 11px; font-weight: bold; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Right Gallery Column */
    .gallery-column { flex: 0.9; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-height: 270px; overflow-y: auto; padding-right: 2px; }
    .gallery-item { width: 100%; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1px solid #cbd5e1; transition: transform 0.15s ease; }
    .gallery-item:active { transform: scale(0.95); }

    /* Action Buttons */
    .action-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-call { background-color: #15803d; color: white; }
    .btn-message { background-color: #1d4ed8; color: white; }

    /* Fullscreen Lightbox Modal */
    .lightbox-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.92); z-index: 99999; justify-content: center; align-items: center; padding: 15px; }
    .lightbox-modal.active { display: flex; }
    .lightbox-modal img { max-width: 100%; max-height: 85vh; border-radius: 8px; object-fit: contain; }
    .lightbox-close { position: absolute; top: 15px; right: 20px; color: #ffffff; font-size: 30px; font-weight: bold; cursor: pointer; }

    /* Sections Hide/Show */
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>

  <div class="app">
    
    <!-- Top Lang Bar -->
    <div class="lang-bar">
      <button class="lang-btn" onclick="setLang('fr')">🇫🇷 FR</button>
      <button class="lang-btn" onclick="setLang('ar')">🇩🇿 ع</button>
      <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
      <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
      <button class="lang-btn" onclick="setLang('it')">🇮🇹 IT</button>
      <button class="lang-btn" onclick="setLang('tr')">🇹🇷 TR</button>
      <button class="lang-btn" onclick="setLang('nl')">🇳🇱 NL</button>
      <button class="lang-btn" onclick="setLang('de')">🇩🇪 DE</button>
      <button class="lang-btn" onclick="setLang('pt')">🇵🇹 PT</button>
    </div>

    <!-- Screen 1: Home -->
    <div id="s-home" class="screen">
      <h2>Accueil</h2>
      <button class="btn btn-message" style="margin-top:20px;" onclick="showScreen('s-worker')">Voir Fiche Artisan (smail)</button>
    </div>

    <!-- Screen 2: Worker Profile Details -->
    <div id="s-worker" class="screen active">
      
      <div class="top-bar">
        <button class="btn-back" onclick="showScreen('s-home')">Retour</button>
        <span class="page-title">Fiche Artisan</span>
        <div></div>
      </div>

      <!-- Profile Header -->
      <div class="profile-header">
        <img id="w-avatar" src="https://images.unsplash.com/photo-1581092921461-eab62e97a780?w=300" alt="Avatar" class="profile-avatar">
        <h2 id="w-name" class="profile-name">smail</h2>
        <span id="w-craft" class="profile-badge">🔧 Plomberie</span>
      </div>

      <!-- Rating -->
      <div class="rating-row">
        <span class="rating-score">2.0</span>
        <span class="stars">★★☆☆☆</span>
        <span style="font-size: 11px; color: #64748b;">(7)</span>
      </div>

      <!-- Info + Gallery Section (Side-by-Side) -->
      <div class="info-gallery-wrapper">
        
        <!-- Left Details Column -->
        <div class="details-column">
          <div class="info-card">
            <div class="info-icon">📞</div>
            <div class="info-content">
              <div class="info-label">Telephone</div>
              <div class="info-value" id="w-phone">0662876332</div>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">📍</div>
            <div class="info-content">
              <div class="info-label">Commune</div>
              <div class="info-value" id="w-commune">SBA</div>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">🏙️</div>
            <div class="info-content">
              <div class="info-label">Ville</div>
              <div class="info-value" id="w-city">SBA</div>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">🌍</div>
            <div class="info-content">
              <div class="info-label">Pays</div>
              <div class="info-value" id="w-country">Algerie</div>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">✉️</div>
            <div class="info-content">
              <div class="info-label">Email</div>
              <div class="info-value" id="w-email">smail31@gmail.com</div>
            </div>
          </div>
        </div>

        <!-- Right Gallery Column -->
        <div class="gallery-column" id="w-gallery">
          <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=300" class="gallery-item" onclick="openLightbox(this.src)" alt="Work 1">
          <img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=300" class="gallery-item" onclick="openLightbox(this.src)" alt="Work 2">
          <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=300" class="gallery-item" onclick="openLightbox(this.src)" alt="Work 3">
          <img src="https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=300" class="gallery-item" onclick="openLightbox(this.src)" alt="Work 4">
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn btn-call" onclick="makeCall()">📞 Appeler</button>
        <button class="btn btn-message" onclick="sendMessage()">💬 Message</button>
      </div>

    </div>

  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div id="imgLightbox" class="lightbox-modal" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="View Large">
  </div>

  <script>
    // Firebase Config Placeholder
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Multilingual Translations Dictionary
    const T = {
      fr: { call: "Appeler", msg: "Message", back: "Retour" },
      ar: { call: "إتصال", msg: "مراسلة", back: "رجوع" },
      en: { call: "Call", msg: "Message", back: "Back" }
    };

    // Countries List
    const COUNTRIES = ["Algerie", "France", "Tunisie", "Maroc"];

    // Crafts Data
    const CRAFTS = [
      { id: 1, name: "Plomberie", icon: "🔧", c: "#1565C0", bg: "#E3F2FD" },
      { id: 2, name: "Électricité", icon: "⚡", c: "#F57C00", bg: "#FFF3E0" },
      { id: 3, name: "Peinture", icon: "🎨", c: "#7B1FA2", bg: "#F3E5F5" },
      { id: 4, name: "Menuiserie", icon: "🪚", c: "#5D4037", bg: "#EFEBE9" },
      { id: 5, name: "Maçonnerie", icon: "🧱", c: "#D32F2F", bg: "#FFEBEE" },
      { id: 6, name: "Climatisation", icon: "❄️", c: "#0288D1", bg: "#E0F7FA" },
      { id: 7, name: "Serrurerie", icon: "🔑", c: "#388E3C", bg: "#E8F5E9" },
      { id: 8, name: "Nettoyage", icon: "🧹", c: "#00695C", bg: "#E0F2F1" }
    ];

    // Navigation Helper
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(screenId);
      if(target) target.classList.add('active');
    }

    // Lightbox Controls
    function openLightbox(src) {
      const lightbox = document.getElementById('imgLightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      lightboxImg.src = src;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('imgLightbox').classList.remove('active');
    }

    // Actions
    function makeCall() {
      const phone = document.getElementById('w-phone').innerText;
      window.location.href = `tel:${phone}`;
    }

    function sendMessage() {
      alert("Ouverture du chat...");
    }

    function setLang(lang) {
      if(lang === 'ar') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    }
  </script>
</body>
</html>
