<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Craftoo</title>
<style>
:root{--bl:#1565C0;--bl2:#0D47A1;--bl3:#1E88E5;--gn:#2E7D32;--rd:#C62828;--gd:#FFB300;--bg:#F0F4F8;--wh:#fff;--tx:#1A1A2E;--sb:#888;--sh:0 2px 12px rgba(0,0,0,0.08);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);}
.app{max-width:500px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden;}
.screen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;}
.lb-bar{background:#0A3880;display:flex;justify-content:center;gap:4px;padding:6px 8px;flex-shrink:0;flex-wrap:wrap;}
.lb{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.8);border-radius:20px;padding:4px 9px;font-size:11px;cursor:pointer;font-weight:700;}
.lb.on{background:#fff;color:#0A3880;}
.page-hdr{background:linear-gradient(135deg,var(--bl),var(--bl2));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-sm{width:34px;height:34px;border-radius:9px;object-fit:cover;border:2px solid rgba(255,255,255,0.35);flex-shrink:0;}
.hdr-t{flex:1;font-size:15px;font-weight:800;}
.back{background:rgba(255,255,255,0.18);border:none;color:#fff;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.hero{background:linear-gradient(160deg,var(--bl) 0%,var(--bl3) 100%);padding:14px 16px 20px;color:#fff;flex-shrink:0;}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.hero-logo{width:54px;height:54px;border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,0.4);}
.app-name{font-size:28px;font-weight:900;letter-spacing:-1px;}
.app-name span{color:#FFD54F;}
.app-tag{font-size:11px;opacity:.85;margin-top:2px;}
.hero-sh{background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.3);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.hero-sh input{border:none;outline:none;background:transparent;color:#fff;font-size:14px;flex:1;width:100%;}
.hero-sh input::placeholder{color:rgba(255,255,255,0.6);}
.stats{display:flex;gap:8px;padding:10px 10px 0;flex-shrink:0;}
.stat{flex:1;background:var(--wh);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--sh);}
.sn{font-size:20px;font-weight:900;color:var(--bl);}
.sl{font-size:10px;color:var(--sb);margin-top:2px;}
.sec{padding:10px 10px 6px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.sec-t{font-weight:800;font-size:13px;}
.sec-c{font-size:11px;color:var(--sb);background:var(--wh);padding:3px 10px;border-radius:20px;box-shadow:var(--sh);}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:4px 8px 80px;}
.cc{background:var(--wh);border-radius:13px;padding:11px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;box-shadow:var(--sh);border:2px solid transparent;transition:transform .12s;}
.cc:active{transform:scale(.95);}
.cc-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.cc-ic img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.cc-n{font-size:11px;font-weight:700;text-align:center;line-height:1.3;}
.cc-b{font-size:10px;color:var(--sb);background:#F5F5F5;border-radius:20px;padding:2px 7px;}
.sbar{background:var(--wh);border-radius:12px;padding:9px 12px;margin:9px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);border:1.5px solid #E3E8F0;flex-shrink:0;}
.sbar input{border:none;outline:none;flex:1;font-size:13px;background:transparent;width:100%;}
.li{padding:0 10px 5px;font-size:11px;color:var(--sb);flex-shrink:0;}
.wc{background:var(--wh);border-radius:13px;padding:11px;margin:0 9px 8px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--sh);border:1.5px solid #F0F0F0;transition:transform .12s;position:relative;}
.wc:active{transform:scale(.98);}
.av{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.wn{font-size:14px;font-weight:800;}
.wl{font-size:11px;color:var(--sb);margin-top:2px;}
.wp{font-size:11px;color:var(--gn);margin-top:2px;font-weight:600;}
.ws{font-size:11px;color:var(--gd);margin-top:2px;}
.wa{font-size:20px;color:#CCC;margin-left:auto;}
.stag{position:absolute;top:8px;right:8px;background:#FFEBEE;color:var(--rd);font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;}
.rb{background:linear-gradient(135deg,var(--bl),var(--bl2));color:#fff;border:none;border-radius:13px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;margin:6px 9px 20px;width:calc(100% - 18px);box-shadow:0 4px 14px rgba(21,101,192,0.3);flex-shrink:0;}
.empty{text-align:center;padding:40px 20px;}
.ei{font-size:46px;margin-bottom:10px;}
.et{font-weight:800;font-size:14px;color:#555;}
.es{font-size:12px;color:#AAA;margin-top:4px;}
.dc{background:var(--wh);border-radius:18px;margin:10px;padding:16px;box-shadow:var(--sh);}
.dav{width:86px;height:86px;border-radius:20px;margin:0 auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:34px;}
.dav img{width:100%;height:100%;object-fit:cover;}
.dn{font-size:19px;font-weight:900;text-align:center;}
.dbg{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;}
.dbw{text-align:center;margin:6px 0 10px;}
.ar{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.an{font-size:24px;font-weight:900;color:var(--gd);}
.as2{font-size:16px;color:var(--gd);}
.ac2{font-size:11px;color:var(--sb);}
.ir{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F5F5F5;}
.iri{width:34px;height:34px;border-radius:9px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.irl{font-size:10px;color:var(--sb);}
.irv{font-size:13px;font-weight:700;margin-top:1px;}
.bg2{background:linear-gradient(135deg,var(--gn),#1B5E20);color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;width:100%;margin-top:12px;}
.bb2{background:linear-gradient(135deg,var(--bl),var(--bl2));color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;width:100%;margin-top:8px;}
.br3{background:#FFEBEE;color:var(--rd);border:none;border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
.rs{background:var(--wh);border-radius:13px;margin:0 10px 8px;padding:13px;box-shadow:var(--sh);}
.rt2{font-weight:800;font-size:13px;margin-bottom:8px;}
.sr{display:flex;gap:8px;}
.sb2{font-size:26px;cursor:pointer;background:none;border:none;padding:0;}
.gc{background:var(--wh);border-radius:13px;margin:0 10px 10px;padding:13px;box-shadow:var(--sh);}
.gt{font-weight:800;font-size:13px;margin-bottom:10px;}
.gg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.gi{aspect-ratio:1;border-radius:9px;background:#F5F5F5;display:flex;align-items:center;justify-content:center;font-size:20px;color:#CCC;overflow:hidden;}
.gi img{width:100%;height:100%;object-fit:cover;}
.gia{border:2px dashed #CCC;background:#FAFAFA;font-size:22px;cursor:pointer;}
.cw{display:flex;flex-direction:column;flex:1;overflow:hidden;}
.cm{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:78%;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.5;word-break:break-word;}
.mme{background:linear-gradient(135deg,var(--bl),var(--bl3));color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.mth{background:var(--wh);color:var(--tx);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:var(--sh);}
.mt3{font-size:10px;opacity:.6;margin-top:3px;}
.cb3{background:var(--wh);padding:9px 11px;display:flex;gap:8px;align-items:center;border-top:1px solid #F0F0F0;flex-shrink:0;}
.ci{flex:1;border:1.5px solid #E3E8F0;border-radius:20px;padding:9px 13px;font-size:13px;outline:none;}
.cs{background:linear-gradient(135deg,var(--bl),var(--bl2));border:none;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tabs{display:flex;border-bottom:2px solid #EEF2FF;margin:0 9px 9px;flex-shrink:0;}
.tab{flex:1;padding:10px;font-size:12px;font-weight:800;border:none;background:transparent;cursor:pointer;color:#AAA;border-bottom:2px solid transparent;margin-bottom:-2px;}
.tab.on{color:var(--bl);border-bottom-color:var(--bl);}
.fsc{padding:0 9px 50px;overflow-y:auto;flex:1;}
.fg{margin-bottom:10px;}
.fl{font-size:11px;font-weight:700;color:#555;margin-bottom:4px;display:block;}
.fi{width:100%;border-radius:10px;border:1.5px solid #E3E8F0;padding:10px 11px;font-size:13px;outline:none;background:#FAFAFA;}
.fi:focus{border-color:var(--bl);background:var(--wh);}
.fsel{width:100%;border-radius:10px;border:1.5px solid #E3E8F0;padding:10px 11px;font-size:13px;outline:none;background:#FAFAFA;color:var(--tx);}
.errmsg{background:#FFEBEE;color:var(--rd);border-radius:9px;padding:9px 12px;margin-bottom:10px;font-size:12px;text-align:center;font-weight:600;}
.sbtn{background:linear-gradient(135deg,var(--bl),var(--bl2));color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;width:100%;margin-top:6px;}
.aup{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;gap:6px;}
.apr{width:74px;height:74px;border-radius:18px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;cursor:pointer;border:3px dashed var(--bl);}
.apr img{width:100%;height:100%;object-fit:cover;}
.ah2{font-size:11px;color:var(--sb);}
.trial-box{background:#E8F5E9;border-radius:10px;padding:10px;margin-bottom:10px;font-size:12px;color:#2E7D32;font-weight:700;text-align:center;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.mo.show{display:flex;}
.md{background:var(--wh);border-radius:18px;padding:18px;width:100%;max-width:360px;}
.mt4{font-size:15px;font-weight:800;margin-bottom:10px;}
.mb4{font-size:13px;color:#555;line-height:1.6;}
.mbs{display:flex;gap:8px;margin-top:13px;}
.mbtn{flex:1;padding:11px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;}
.mnk{background:#F5F5F5;color:#555;}
.mok{background:linear-gradient(135deg,var(--rd),#B71C1C);color:#fff;}
.fsov{position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:9999;display:none;align-items:center;justify-content:center;}
.fsov.show{display:flex;}
.fsbig{max-width:100vw;max-height:90vh;object-fit:contain;border-radius:8px;}
.fsx{position:absolute;top:14px;right:14px;background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;z-index:10000;}
.terms-ov{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;}
.terms-hdr{background:linear-gradient(135deg,#1565C0,#0D47A1);color:#fff;padding:16px;text-align:center;flex-shrink:0;}
.terms-hdr h2{font-size:17px;font-weight:900;margin-bottom:4px;}
.terms-hdr p{font-size:12px;opacity:.85;}
.terms-body{flex:1;overflow-y:auto;padding:14px;font-size:13px;line-height:1.8;color:#333;}
.terms-body h3{font-size:13px;font-weight:800;color:#1565C0;margin:14px 0 6px;}
.terms-body ul{padding-right:16px;margin-bottom:8px;}
.terms-body ul li{margin-bottom:4px;}
.terms-footer{flex-shrink:0;padding:12px 14px;background:#F8F9FA;border-top:2px solid #E3E8F0;}
.terms-check{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.terms-check input{width:22px;height:22px;cursor:pointer;flex-shrink:0;margin-top:2px;}
.terms-check label{font-size:13px;line-height:1.6;cursor:pointer;}
.terms-btns{display:flex;gap:10px;}
.t-acc{flex:2;background:linear-gradient(135deg,#2E7D32,#1B5E20);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;}
.t-dec{flex:1;background:#FFEBEE;color:#C62828;border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.ssc{text-align:center;padding:50px 20px;}
.si{font-size:56px;margin-bottom:12px;}
.st2{font-size:18px;font-weight:900;color:var(--rd);margin-bottom:8px;}
.ss2{font-size:13px;color:var(--sb);line-height:1.6;}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>

function renderCrafts(list){

  var ws=db.workers();set("sl-wnum",ws.length);
  list.forEach(function(c){
    var cnt=ws.filter(function(w){return w.craftId===c.id;}).length;
    var d=document.createElement("div");
    d.className="cc";d.style.borderColor=c.bg;
    d.innerHTML='<div class="cc-ic" style="background:'+c.bg+'">'+craftIconHtml(c)+'</div><div class="cc-n" style="color:'+c.c+'">'+cn(c)+'</div><div class="cc-b">'+cnt+" "+t("art")+"</div>";

  var q=$("inp-home").value.trim().toLowerCase();
  renderCrafts(q?CRAFTS.filter(function(c){return Object.values(c).some(function(v){return typeof v==="string"&&v.toLowerCase().includes(q);});}):CRAFTS);
}

function openCraft(id){
  craft=CRAFTS.find(function(c){return c.id===id;});
  $("chdr").style.background="linear-gradient(135deg,"+craft.c+"DD,"+craft.c+")";
  set("chdr-t",cn(craft));
  $("inp-craft").value="";
  renderW(db.workers().filter(function(w){return w.craftId===id;}));
  go("craft");
}

function filterW(){
  var q=document.getElementById("inp-craft").value.trim().toLowerCase();
  if(!craft)return;
  var a=db.workers().filter(function(w){return w.craftId===craft.id;});
  renderW(q?a.filter(function(w){
    var fields=[w.name,w.city,w.commune,w.country,w.phone].filter(Boolean).join(" ").toLowerCase();
    return fields.includes(q);
  }):a);
}

  var el=$("w-list");
  set("w-cnt",list.length+" "+t("av"));

    el.innerHTML='<div class="empty"><div class="ei">👷</div><div class="et">'+t("nw")+'</div><div class="es">'+t("ns")+"</div></div>";

    var susp=w.suspUntil&&w.suspUntil>now;

function ir(icon,label,val){return'<div class="ir"><div class="iri">'+icon+'</div><div><div class="irl">'+label+'</div><div class="irv">'+val+"</div></div></div>";}

function rateWorker(btn){var n=parseInt(btn.getAttribute("data-n")),wid=btn.getAttribute("data-wid");doRate(n,wid);}
function doRate(n,wid){
  for(var i=1;i<=5;i++){var e=$("sb"+i);if(e)e.textContent=i<=n?"⭐":"☆";}
  var w=db.workers().find(function(x){return x.id===wid;});if(!w)return;
  var oc=w.ratingCount||0,oa=w.ratingAvg||0;
  w.ratingCount=oc+1;w.ratingAvg=((oa*oc)+n)/w.ratingCount;
  db.saveW(w);worker=w;showToast("⭐ "+t("ok"));
}

function confRep(wid){
  $("m-t").textContent=t("rpt");$("m-b").textContent=t("rpb");
  $("m-nk").textContent=t("rnk");$("m-ok").textContent=t("rok");
  $("m-ok").onclick=function(){doRep(wid);};
  $("modal").classList.add("show");
}
function closeMo(){$("modal").classList.remove("show");}
function doRep(wid){
  closeMo();
  var w=db.workers().find(function(x){return x.id===wid;});if(!w)return;
  w.reports=(w.reports||0)+1;
  if(w.reports>=5){var d=new Date();d.setDate(d.getDate()+30);w.suspUntil=d.getTime();}
  db.saveW(w);worker=w;renderDet(w);showToast("🚨 "+t("ok"));
}

function callWorker(btn){window.open("tel:"+btn.getAttribute("data-ph"));}
function chatWorker(btn){openChat(btn.getAttribute("data-wid"),btn.getAttribute("data-wname"));}
function repWorker(btn){confRep(btn.getAttribute("data-wid"));}
function openChat(wid,wname){
  var wid = typeof btnOrId === 'object' ? btnOrId.getAttribute('data-wid') : btnOrId;
  if(typeof btnOrId === 'object') wname = decodeURIComponent(btnOrId.getAttribute('data-wname'));
  if(!user){showToast("Connectez-vous d abord");return;}
  chatId=[user.id,wid].sort().join("_");
  set("chat-t","💬 "+wname);ph("chat-in",t("cph"));
  renderMsgs();go("chat");
}
function renderMsgs(){
  if(!chatId)return;
  var msgs=db.msgs(chatId);var el=$("chat-m");
  if(!msgs.length){el.innerHTML='<div style="text-align:center;padding:30px;color:#AAA;font-size:13px">💬 Envoyez votre premier message!</div>';return;}
  el.innerHTML=msgs.map(function(m){
    var me=m.uid===user.id;
    var time=new Date(m.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    return'<div class="msg '+(me?"mme":"mth")+'">'+m.text+'<div class="mt3">'+time+"</div></div>";
  }).join("");
  el.scrollTop=el.scrollHeight;
}
function sendMsg(){
  var inp=$("chat-in");var text=inp.value.trim();
  if(!text||!chatId||!user)return;
  inp.value="";
  db.addMsg(chatId,{uid:user.id,text:text,ts:Date.now()});
  renderMsgs();
}

function prevAv(inp){

  var r=new FileReader();
  r.onload=function(e){$("apr").innerHTML='<img src="'+e.target.result+'">';};
  r.readAsDataURL(avFile);
}

function buildGalUp(){
  var g=$("gal-up");g.innerHTML="";
  for(var i=0;i<6;i++) g.innerHTML+='<div class="gi gia" onclick="document.getElementById('gal-file').click()">➕</div>';
}

function prevGal(inp){
  galFiles=Array.from(inp.files).slice(0,6);
  var g=$("gal-up");g.innerHTML="";
  galFiles.forEach(function(f){
    var r=new FileReader();
    r.onload=function(e){g.innerHTML+='<div class="gi"><img src="'+e.target.result+'"></div>';};
    r.readAsDataURL(f);
  });
  for(var i=galFiles.length;i<6;i++) g.innerHTML+='<div class="gi gia" onclick="document.getElementById('gal-file').click()">➕</div>';
}

function doReg(){
  var name=$("r-name").value.trim(),email=$("r-email").value.trim();
  var pass=$("r-pass").value,conf=$("r-conf").value;
  var phone=$("r-tel").value.trim(),country=$("r-pay").value;
  var city=$("r-vil").value.trim(),commune=$("r-com").value.trim();
  var craftId=parseInt($("r-met").value);
  if(!name||!email||!pass||!phone||!country||!craftId){showErr("e-reg",t("ef"));return;}
  if(pass!==conf){showErr("e-reg",t("ep"));return;}
  if(db.workers().find(function(w){return w.email===email;})){showErr("e-reg",t("ee"));return;}
  var id="w"+Date.now();
  var photo="",gallery=[];
  function fin(){
    var w={id:id,name:name,email:email,phone:phone,country:country,city:city,commune:commune,craftId:craftId,photo:photo,gallery:gallery,reports:0,ratingAvg:0,ratingCount:0,trialStart:Date.now()};
    db.saveW(w);user={id:id,name:name,email:email};db.set("user",user);
    craft=CRAFTS.find(function(c){return c.id===craftId;});
    set("sl-wnum",db.workers().length);
    showToast(t("ok"));openCraft(craftId);
  }
  if(avFile){
    var r=new FileReader();
    r.onload=function(e){
      photo=e.target.result;
      if(galFiles.length){
        var done=0;
        galFiles.forEach(function(f,i){
          var r2=new FileReader();
          r2.onload=function(ev){gallery[i]=ev.target.result;done++;if(done===galFiles.length)fin();};
          r2.readAsDataURL(f);
        });
      } else fin();
    };
    r.readAsDataURL(avFile);
  } else fin();
}

function doLog(){
  var email=$("l-email").value.trim(),pass=$("l-pass").value;
  if(!email||!pass){showErr("e-log",t("ex"));return;}
  var w=db.workers().find(function(x){return x.email===email;});
  if(!w){showErr("e-log",t("en2"));return;}
  user={id:w.id,name:w.name,email:w.email};db.set("user",user);
  craft=CRAFTS.find(function(c){return c.id===w.craftId;});
  showToast(t("ok"));
  if(craft)openCraft(craft.id);else go("home");
}

function closePhoto(){

}
document.addEventListener("DOMContentLoaded",function(){
  var fsx=document.getElementById("fsx");
  if(fsx)fsx.onclick=function(){closePhoto();};
  var fsov=document.getElementById("fsov");
  if(fsov){
    var lt=0;

      if(e.target===document.getElementById("fsx"))return;
      var now=Date.now();

      lt=now;
    });
  }
});
